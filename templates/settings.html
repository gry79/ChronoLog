{% extends "base.html" %}
{% block title %}ChronoLog{% endblock %}

{% block content %}
<div class="max-w-2xl space-y-6">
  <h1 class="text-xl font-semibold text-slate-900">Einstellungen</h1>

  <form method="post" class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="action" value="profile">

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Benutzername</label>
        <input type="text" name="username" value="{{ user.username }}" required
               class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Chronos</label>
        <select name="chronos_id" class="form-control w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
          <option value="">— bitte wählen —</option>
          {% for c in all_chronos %}
          <option value="{{ c.id }}" {% if user.chronos_id == c.id %}selected{% endif %}>
            {{ c.name }} ({{ '%.1f'|format(c.daily_target_hours) }} h)
          </option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Vorname</label>
        <input type="text" name="first_name" value="{{ user.first_name }}" required
               class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Nachname</label>
        <input type="text" name="last_name" value="{{ user.last_name }}" required
               class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Startjahr</label>
        <input type="number" name="start_year" value="{{ user.start_year or '' }}" min="2000" max="2100"
               class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" placeholder="z.B. 2025">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Startmonat</label>
        <input type="number" name="start_month" value="{{ user.start_month or '' }}" min="1" max="12"
               class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" placeholder="1–12">
      </div>
      <div class="sm:col-span-2">
        <label class="block text-sm font-medium text-slate-700 mb-1">Initiales Zeitkonto (h)</label>
        <input type="text" name="initial_balance" value="{{ '%.1f'|format(user.initial_balance) }}"
               class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
        <p class="text-xs text-slate-400 mt-1">Wird im Startmonat als «Zeitkonto Vormonat» verwendet.</p>
      </div>
    </div>

    <div class="pt-2">
      <button type="submit" class="px-4 py-2 rounded-lg bg-chrono-800 hover:bg-chrono-700 text-white text-sm font-medium">
        Speichern
      </button>
    </div>
  </form>

  <form method="post" class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="action" value="password">
    <h2 class="font-medium text-slate-900">Passwort ändern</h2>
    <div class="space-y-3 max-w-md">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Aktuelles Passwort</label>
        <input type="password" name="current_password" required
               class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" autocomplete="current-password">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Neues Passwort</label>
        <input type="password" name="new_password" required minlength="6"
               class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" autocomplete="new-password">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Neues Passwort wiederholen</label>
        <input type="password" name="new_password_repeat" required minlength="6"
               class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" autocomplete="new-password">
      </div>
    </div>
    <button type="submit" class="px-4 py-2 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-sm font-medium">
      Passwort ändern
    </button>
  </form>
</div>
{% endblock %}
