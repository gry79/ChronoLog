<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChronoLog</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" sizes="any">
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32x32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='img/favicon-16x16.png') }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
  <link rel="manifest" href="{{ url_for('static', filename='site.webmanifest') }}">
  <meta name="theme-color" content="#134e4a">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            chrono: { 700: '#0f766e', 800: '#115e59', 900: '#134e4a' },
            amberglow: '#f59e0b',
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen flex items-center justify-center bg-cover bg-center bg-no-repeat"
      style="background-image: linear-gradient(rgba(15, 23, 42, 0.55), rgba(15, 23, 42, 0.65)), url('{{ url_for('static', filename='img/login-bg.jpg') }}');">
  <div class="w-full max-w-md mx-4">
    <div class="bg-white/95 backdrop-blur rounded-2xl shadow-2xl p-8 border border-white/20">
      <div class="text-center mb-8">
        <div class="text-4xl mb-2">⏱</div>
        <h1 class="text-3xl font-bold text-chrono-900 tracking-tight">ChronoLog</h1>
        <p class="text-slate-500 text-sm mt-1">Zeiterfassung mit Übersicht</p>
      </div>

      {% if error %}
      <div class="mb-4 rounded-lg bg-red-50 text-red-800 border border-red-200 px-4 py-3 text-sm">
        {{ error }}
      </div>
      {% endif %}

      <form method="post" action="{{ url_for('auth.login') }}" class="space-y-4" autocomplete="on">
        <div>
          <label for="username" class="block text-sm font-medium text-slate-700 mb-1">Benutzername</label>
          <input type="text" id="username" name="username" required autofocus value="{{ username or '' }}"
                 class="w-full rounded-lg border border-slate-300 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-chrono-700 focus:border-transparent"
                 autocomplete="username">
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Passwort</label>
          <input type="password" id="password" name="password" required
                 class="w-full rounded-lg border border-slate-300 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-chrono-700 focus:border-transparent"
                 autocomplete="current-password">
        </div>
        <button type="submit"
                class="w-full bg-chrono-800 hover:bg-chrono-700 text-white font-medium py-2.5 rounded-lg transition shadow">
          Anmelden
        </button>
      </form>

      {% if registration_allowed %}
      <p class="mt-6 text-center text-xs text-slate-500">
        Noch kein Konto?
        <a href="{{ url_for('auth.register') }}" class="text-chrono-700 hover:underline">Registrieren</a>
      </p>
      {% endif %}
    </div>
  </div>
</body>
</html>
