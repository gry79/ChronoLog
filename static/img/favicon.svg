<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="ChronoLog">
  <rect width="32" height="32" rx="6" fill="#134e4a"/>
  <!-- stem -->
  <rect x="14" y="2" width="4" height="5" rx="1" fill="#0f766e"/>
  <!-- button -->
  <rect x="11.5" y="1" width="9" height="3" rx="1.5" fill="#f59e0b"/>
  <!-- crown -->
  <rect x="26" y="11" width="3.5" height="5" rx="1" fill="#0f766e"/>
  <!-- bezel -->
  <circle cx="16" cy="18" r="11" fill="#0f766e"/>
  <circle cx="16" cy="18" r="9" fill="#f0fdfa"/>
  <!-- marks -->
  <circle cx="16" cy="10.5" r="1.1" fill="#134e4a"/>
  <circle cx="23.5" cy="18" r="1.1" fill="#134e4a"/>
  <circle cx="16" cy="25.5" r="1.1" fill="#134e4a"/>
  <circle cx="8.5" cy="18" r="1.1" fill="#134e4a"/>
  <!-- hands -->
  <line x1="16" y1="18" x2="13" y2="11.5" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="18" x2="20.5" y2="16" stroke="#042f2e" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="16" cy="18" r="1.6" fill="#f59e0b"/>
